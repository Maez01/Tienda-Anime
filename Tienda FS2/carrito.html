<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Animate Ltda.</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >

    <style>
        body {
            background-image: url('Imagenes/logo+nombre.jpg');
            background-size: auto;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div class="container"> 

    <h1 class="text-center mt-4">

        Mi carrito
    </h1>

    <div class="row mt-4">
        <!-- Productos -->
         <div class="col-md-8">

            <h2>Productos</h2> 

            <div id="Lista-carrito">

                <!-- JavaScript colocará aquí los productos -->

            </div>

        </div>

        <!-- Resumen -->
         <div class="col-md-4">

            <div class="card-body">

                <h2 class="card-title">
                    Resumend de compra
                </h2>


                <p>
                    Total:
                    $<span id="total">0</span>
                </p>

                <button class="btn btn-primary">

                    Finalizar compra
                </button>
            </div>

            <h2>Resumen de compra</h2>

         </div>
    </div>

    </div>
    
    
    
    
    
    
    
    <!-- Bootstrap --> 
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    
    <!-- Tu archivo de JavaScript referenciado correctamente según el nombre que elijas (ej: app.js) -->
    <script src="js/app.js"></script>
</body>
</html>
