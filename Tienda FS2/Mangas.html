<!-- Sección de Filtros y Búsqueda -->
<div class="container bg-white p-4 rounded shadow-sm mb-4">
    <div class="row g-3 align-items-center">
        <!-- Barra de búsqueda interna del catálogo -->
        <div class="col-md-4">
            <input type="text" id="buscarManga" class="form-control" placeholder="Buscar por título...">
        </div>
        <!-- Filtro de Género -->
        <div class="col-md-4">
            <select id="filtroGenero" class="form-select">
                <option value="todos">Todos los géneros</option>
                <option value="shonen">Shonen</option>
                <option value="seinen">Seinen</option>
                <option value="shojo">Shojo</option>
                <option value="slice of life">Slice of Life</option>
                <option value="fantasia">Fantasía</option>
                <option value="terror">Terror</option>
                <option value="josei">Josei</option>
                <option value="isekai">Isekai</option>
            </select>
        </div>
        <!-- Filtro de Orden -->
        <div class="col-md-4">
            <select id="filtroOrden" class="form-select">
                <option value="predeterminado">Ordenar por...</option>
                <option value="mas-vistos">Más vistos</option>
                <option value="recientes">Más recientes</option>
            </select>
        </div>
    </div>
</div>

<!-- Contenedor Principal donde JavaScript "inyectará" las 50+ tarjetas de mangas -->
<div class="container mb-5">
    <div id="contenedor-mangas" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
        <!-- JS llenará esto dinámicamente. No escribas nada aquí a mano. -->
    </div>
</div>

<!-- Ventana Modal de Bootstrap (Se abrirá sola al hacer clic en "Ver Volúmenes") -->
<div class="modal fade" id="modalVolumenes" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold" id="modalMangaTitulo">Título del Manga</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-shadow="none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="modalMangaSinopsis" class="text-light opacity-75 mb-4"></p>
                <h5 class="fw-bold mb-3">Tomos Disponibles:</h5>
                <!-- Aquí JS meterá los tomos individuales del manga seleccionado -->
                <div id="contenedor-tomos" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3"></div>
            </div>
        </div>
    </div>
</div>
